<!doctype html>
<html lang="es">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestro de Búsqueda</title>

<style>
/* Layout: mapa de mundos -> nivel. En un nivel, el grafo a la izquierda y la estructura de datos con las acciones del jugador a la derecha. */
:root {
  --font-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;

  --bad-soft: #fde2e2;
  --amber: #f2a900;
  --amber-soft: #fff1c9;
  --n-idle: #e7eaf5;
  --n-frontier: #f6d27a;
  --n-current: #2456e6;
  --n-done: #bfe3d2;
  --n-path: #12805c;
  --on-strong: #ffffff;
  --edge: #8a93b2;
  --w1: #7a55e8; --w2: #1d8fd1; --w3: #e0662b; --w4: #12805c; --w5: #c93d86; --w6: #6b7280;

  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #171f35; --ink: #e8ecf8; --muted: #9aa5c7; --line: #2a3556;
    --primary: #7b9bff; --on-primary: #0a1020; --soft: #1f2c55; --good: #3fd09a; --good-soft: #14392d;
    --bad: #ff8080; --bad-soft: #432024; --amber: #f6c244; --amber-soft: #43380f;
    --n-idle: #27304d; --n-frontier: #a47a14; --n-current: #7b9bff; --n-done: #2b5a47; --n-path: #3fd09a;
    --on-strong: #0a1020; --edge: #6e789c;
    --w1: #a78bfa; --w2: #55b6ee; --w3: #f59063; --w4: #3fd09a; --w5: #ee7fb6; --w6: #9ca3af;
    color-scheme: dark;
  }

  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 800; margin-bottom: 8px; }

p { margin: 0 0 8px; }

.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-family: var(--font-data); font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.pill.err { background: var(--bad-soft); color: var(--bad); }

.world p { color: var(--muted); font-size: 0.92rem; margin: 0; }
.lvls { display: flex; flex-wrap: wrap; gap: 8px; }
.lvl { font: inherit; font-weight: 700; font-size: 0.9rem; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.lvl:hover { border-color: var(--wc); }
.lvl.done { background: var(--good-soft); border-color: transparent; }
.stars { color: var(--amber); letter-spacing: 1px; font-size: 0.95rem; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.howto div { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.howto b { display: block; }
/* nivel */
.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }

svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
.e { fill: none; stroke: var(--edge); stroke-width: 1.8; } .e.on { stroke: var(--n-path); stroke-width: 4.5; }
.ah { fill: var(--edge); } .ah.on { fill: var(--n-path); }
.w { font-family: var(--font-data); font-size: 12px; font-weight: 700; fill: var(--ink); stroke: var(--surface); stroke-width: 4px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
.nd circle { stroke: var(--edge); stroke-width: 1.5; fill: var(--n-idle); }
.nd text { font-family: var(--font-data); font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.nd.frontier circle { fill: var(--n-frontier); } .nd.done circle { fill: var(--n-done); }
.nd.current circle { fill: var(--n-current); stroke: var(--ink); stroke-width: 3; } .nd.path circle { fill: var(--n-path); }
.nd.current text, .nd.path text { fill: var(--on-strong); }
.nd.nbr circle { stroke: var(--amber); stroke-width: 3.5; stroke-dasharray: 5 3; }
.tag { font-family: var(--font-ui); font-size: 11px; font-weight: 800; fill: var(--muted); text-anchor: middle; text-transform: uppercase; letter-spacing: 0.05em; }
/* estructuras */
.tok { font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; min-width: 46px; min-height: 46px; padding: 4px 10px; border-radius: 10px; background: var(--n-frontier); color: var(--ink);
  border: 2px solid var(--ink); cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }

.tok.static { cursor: default; }

.qwrap { display: flex; align-items: center; gap: 8px; }

.swrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; align-items: center; }

.chip.res { background: var(--n-done); border-color: transparent; }
.empty { color: var(--muted); font-style: italic; font-size: 0.86rem; }
.fb { border-radius: 10px; padding: 10px 12px; font-weight: 600; background: var(--soft); }

.coach { border: 2px solid var(--amber); background: var(--amber-soft); border-radius: 12px; padding: 10px 12px; }

.tray { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.prog { font-family: var(--font-data); font-size: 0.82rem; background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.prog .cur { background: var(--amber-soft); font-weight: 700; border-radius: 4px; padding: 0 4px; }
.prog .past { color: var(--muted); }
.result h3 { margin-bottom: 4px; }
/* intro */
.card { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card .vis { background: var(--bg); border-radius: 12px; padding: 14px; overflow-x: auto; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--primary); }
/* colina */
.bar { fill: var(--n-done); stroke: var(--edge); stroke-width: 1; } .bar.fog { fill: var(--n-idle); opacity: 0.55; stroke: none; }
.bar.here { fill: var(--n-current); } .bar.glob { fill: var(--n-path); } .bar.loc { fill: var(--n-frontier); }
.vl { font-family: var(--font-data); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; max-width: 230px; }
.board.mini { max-width: 104px; gap: 3px; }
.tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; background: var(--n-idle); border: 2px solid var(--line); border-radius: 8px; font-family: var(--font-data); font-weight: 700; font-size: 1.5rem; }
.mini .tile { font-size: 0.9rem; border-width: 1.5px; border-radius: 5px; }
.tile.hole { background: transparent; border-style: dashed; }
.nbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.nb { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 5px; align-items: center; font-size: 0.8rem; text-align: center; cursor: pointer; }
.nb:hover { border-color: var(--primary); }
.hnum { font-family: var(--font-data); font-weight: 700; }
input[type="number"] { font: inherit; font-family: var(--font-data); width: 84px; padding: 7px 9px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { font: inherit; font-weight: 600; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px 13px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }

.hints { margin: 8px 0 0; padding-left: 18px; font-size: 0.92rem; }

.tile.wrong { border-color: var(--bad); background: var(--bad-soft); }

.stepper .arr { color: var(--muted); }
.instr { font-size: 1rem; margin: 6px 0 8px; }
.log { margin: 0; padding-left: 20px; font-size: 0.88rem; }
.log li { margin-bottom: 3px; } .log li:last-child { font-weight: 700; }
.cap { font-weight: 700; margin-bottom: 6px; min-height: 1.5em; }
.e.cur { stroke: var(--n-current); stroke-width: 4; } .ah.cur { fill: var(--n-current); }
.hgrid { display: grid; gap: 5px; width: 100%; max-width: 680px; }
.cell { aspect-ratio: 1; min-height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--n-idle); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; color: var(--ink); padding: 0; line-height: 1.1; }
.cell.fog { opacity: 0.4; }
.cell.nb { border: 2px dashed var(--amber); cursor: pointer; background: var(--amber-soft); font: inherit; font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; color: var(--ink); }

.cell small { font-size: 0.72rem; font-weight: 700; }

.cell .arrow { position: absolute; top: 1px; right: 4px; font-size: 0.85rem; opacity: 0.75; }
.opt.sel { border-color: var(--primary); background: var(--soft); }
.xbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.xbar i { display: block; height: 100%; background: var(--primary); transition: width 0.3s; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
