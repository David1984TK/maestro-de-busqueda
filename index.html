<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestro de Búsqueda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: mapa de mundos -> nivel. En un nivel, el grafo a la izquierda y la estructura de datos con las acciones del jugador a la derecha. */
:root {
  --font-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --ink: #17203a;
  --muted: #5d6685;
  --line: #d8dcec;
  --primary: #2456e6;
  --on-primary: #ffffff;
  --soft: #e6ecff;
  --good: #12805c;
  --good-soft: #d9f3e8;
  --bad: #c42b2b;
  --bad-soft: #fde2e2;
  --amber: #f2a900;
  --amber-soft: #fff1c9;
  --n-idle: #e7eaf5;
  --n-frontier: #f6d27a;
  --n-current: #2456e6;
  --n-done: #bfe3d2;
  --n-path: #12805c;
  --on-strong: #ffffff;
  --edge: #8a93b2;
  --w1: #7a55e8; --w2: #1d8fd1; --w3: #e0662b; --w4: #12805c; --w5: #c93d86; --w6: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #171f35; --ink: #e8ecf8; --muted: #9aa5c7; --line: #2a3556;
    --primary: #7b9bff; --on-primary: #0a1020; --soft: #1f2c55; --good: #3fd09a; --good-soft: #14392d;
    --bad: #ff8080; --bad-soft: #432024; --amber: #f6c244; --amber-soft: #43380f;
    --n-idle: #27304d; --n-frontier: #a47a14; --n-current: #7b9bff; --n-done: #2b5a47; --n-path: #3fd09a;
    --on-strong: #0a1020; --edge: #6e789c;
    --w1: #a78bfa; --w2: #55b6ee; --w3: #f59063; --w4: #3fd09a; --w5: #ee7fb6; --w6: #9ca3af;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #171f35; --ink: #e8ecf8; --muted: #9aa5c7; --line: #2a3556;
  --primary: #7b9bff; --on-primary: #0a1020; --soft: #1f2c55; --good: #3fd09a; --good-soft: #14392d;
  --bad: #ff8080; --bad-soft: #432024; --amber: #f6c244; --amber-soft: #43380f;
  --n-idle: #27304d; --n-frontier: #a47a14; --n-current: #7b9bff; --n-done: #2b5a47; --n-path: #3fd09a;
  --on-strong: #0a1020; --edge: #6e789c;
  --w1: #a78bfa; --w2: #55b6ee; --w3: #f59063; --w4: #3fd09a; --w5: #ee7fb6; --w6: #9ca3af;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
h3 { font-size: 1.15rem; font-weight: 800; }
p { margin: 0 0 8px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 8px 15px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--primary); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.sm { padding: 5px 11px; font-size: 0.9rem; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-data); }
/* barra superior */
.topbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.topbar .title { display: flex; flex-direction: column; min-width: 0; }
.topbar .kicker { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 800; color: var(--muted); }
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-family: var(--font-data); font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
/* mapa */
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.world { display: flex; flex-direction: column; gap: 10px; }
.world .head { display: flex; gap: 12px; align-items: center; }
.badge { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--wc); font-family: var(--font-data); font-size: 0.95rem; }
:root[data-theme="dark"] .badge { color: #0a1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #0a1020; } }
.world p { color: var(--muted); font-size: 0.92rem; margin: 0; }
.lvls { display: flex; flex-wrap: wrap; gap: 8px; }
.lvl { font: inherit; font-weight: 700; font-size: 0.9rem; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.lvl:hover { border-color: var(--wc); }
.lvl.done { background: var(--good-soft); border-color: transparent; }
.stars { color: var(--amber); letter-spacing: 1px; font-size: 0.95rem; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.howto div { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.howto b { display: block; }
/* nivel */
.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0, 1fr); } }
svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
.e { fill: none; stroke: var(--edge); stroke-width: 1.8; } .e.on { stroke: var(--n-path); stroke-width: 4.5; }
.ah { fill: var(--edge); } .ah.on { fill: var(--n-path); }
.w { font-family: var(--font-data); font-size: 12px; font-weight: 700; fill: var(--ink); stroke: var(--surface); stroke-width: 4px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
.nd circle { stroke: var(--edge); stroke-width: 1.5; fill: var(--n-idle); }
.nd text { font-family: var(--font-data); font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.nd.frontier circle { fill: var(--n-frontier); } .nd.done circle { fill: var(--n-done); }
.nd.current circle { fill: var(--n-current); stroke: var(--ink); stroke-width: 3; } .nd.path circle { fill: var(--n-path); }
.nd.current text, .nd.path text { fill: var(--on-strong); }
.nd.nbr circle { stroke: var(--amber); stroke-width: 3.5; stroke-dasharray: 5 3; }
.tag { font-family: var(--font-ui); font-size: 11px; font-weight: 800; fill: var(--muted); text-anchor: middle; text-transform: uppercase; letter-spacing: 0.05em; }
/* estructuras */
.tok { font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; min-width: 46px; min-height: 46px; padding: 4px 10px; border-radius: 10px; background: var(--n-frontier); color: var(--ink);
  border: 2px solid var(--ink); cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.tok small { font-size: 0.68rem; font-weight: 500; }
.tok.sm { min-width: 40px; min-height: 40px; font-size: 0.95rem; background: var(--n-idle); }
.tok.used { opacity: 0.35; cursor: default; }
.tok.static { cursor: default; }
@keyframes pop { from { transform: scale(0.6); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
.qwrap { display: flex; align-items: center; gap: 8px; }
.qrow { display: flex; gap: 6px; flex: 1; min-height: 62px; padding: 7px; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); overflow-x: auto; align-items: center; }
.qlab { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: center; line-height: 1.2; flex: none; width: 52px; }
.swrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.scol { display: flex; flex-direction: column; gap: 5px; min-height: 90px; width: 160px; padding: 8px 8px 8px; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); border-radius: 0 0 10px 10px; align-items: stretch; justify-content: flex-start; }
.scol .tok { width: 100%; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; min-height: 70px; padding: 10px; border: 3px dashed var(--ink); border-radius: 12px; align-items: center; }
.sempty { color: var(--muted); font-style: italic; font-size: 0.88rem; margin: auto; }
.pulse { animation: pulse 1s ease-in-out infinite; outline: 3px solid var(--amber); outline-offset: 2px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,0,0.7); } 50% { box-shadow: 0 0 0 9px rgba(242,169,0,0); } }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; align-items: center; }
.chip { font-family: var(--font-data); font-size: 0.86rem; padding: 2px 9px; border-radius: 6px; background: var(--n-idle); border: 1px solid var(--line); }
.chip.res { background: var(--n-done); border-color: transparent; }
.empty { color: var(--muted); font-style: italic; font-size: 0.86rem; }
.fb { border-radius: 10px; padding: 10px 12px; font-weight: 600; background: var(--soft); }
.fb.ok { background: var(--good-soft); } .fb.err { background: var(--bad-soft); animation: shake 0.3s; }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
.coach { border: 2px solid var(--amber); background: var(--amber-soft); border-radius: 12px; padding: 10px 12px; }
.coach b.t { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.prog { font-family: var(--font-data); font-size: 0.82rem; background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.prog .cur { background: var(--amber-soft); font-weight: 700; border-radius: 4px; padding: 0 4px; }
.prog .past { color: var(--muted); }
.result h3 { margin-bottom: 4px; }
/* intro */
.card { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card .vis { background: var(--bg); border-radius: 12px; padding: 14px; overflow-x: auto; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--primary); }
/* colina */
.bar { fill: var(--n-done); stroke: var(--edge); stroke-width: 1; } .bar.fog { fill: var(--n-idle); opacity: 0.55; stroke: none; }
.bar.here { fill: var(--n-current); } .bar.glob { fill: var(--n-path); } .bar.loc { fill: var(--n-frontier); }
.vl { font-family: var(--font-data); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; max-width: 230px; }
.board.mini { max-width: 104px; gap: 3px; }
.tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; background: var(--n-idle); border: 2px solid var(--line); border-radius: 8px; font-family: var(--font-data); font-weight: 700; font-size: 1.5rem; }
.mini .tile { font-size: 0.9rem; border-width: 1.5px; border-radius: 5px; }
.tile.hole { background: transparent; border-style: dashed; }
.nbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.nb { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 5px; align-items: center; font-size: 0.8rem; text-align: center; cursor: pointer; }
.nb:hover { border-color: var(--primary); }
.hnum { font-family: var(--font-data); font-weight: 700; }
input[type="number"] { font: inherit; font-family: var(--font-data); width: 84px; padding: 7px 9px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
/* quiz */
.opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { font: inherit; font-weight: 600; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px 13px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.hints { margin: 8px 0 0; padding-left: 18px; font-size: 0.92rem; }
.hints li { margin-bottom: 4px; }
.picker { display: flex; flex-direction: column; gap: 8px; }
.picker .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picker .lab { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; color: var(--muted); min-width: 72px; }
.dtab { border-collapse: collapse; font-family: var(--font-data); font-size: 0.82rem; }
.dtab th, .dtab td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; }
.route { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-family: var(--font-data); font-weight: 700; }
.route .city { background: var(--n-frontier); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 9px; }
.tile.wrong { border-color: var(--bad); background: var(--bad-soft); }
.tile sub { position: absolute; right: 4px; bottom: 1px; font-size: 0.68rem; font-weight: 500; color: var(--muted); }
.tile.far sub { color: var(--bad); font-weight: 700; }
.mini .tile sub { font-size: 0.55rem; right: 2px; bottom: 0; }
.route .leg { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font-size: 0.8rem; color: var(--muted); }
.route .leg small { font-size: 0.72rem; color: var(--ink); }
.formula { font-family: var(--font-data); font-size: 0.86rem; overflow-wrap: anywhere; margin: 4px 0 0; }
.ghost { position: fixed; z-index: 60; pointer-events: none; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; border-radius: 10px; background: var(--n-frontier); border: 2px solid var(--ink); color: var(--ink); }
.ghost.x { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-size: 1.5rem; }
.flash-err { outline: 3px solid var(--bad); outline-offset: 2px; }
.stepper { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.stepper .st { display: inline-flex; gap: 6px; align-items: center; font-size: 0.82rem; font-weight: 700; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 2px solid var(--line); }
.stepper .st b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 0.75rem; }
.stepper .st.on { background: var(--soft); color: var(--ink); border-color: var(--primary); }
.stepper .st.on b { background: var(--primary); color: var(--on-primary); }
.stepper .arr { color: var(--muted); }
.instr { font-size: 1rem; margin: 6px 0 8px; }
.log { margin: 0; padding-left: 20px; font-size: 0.88rem; }
.log li { margin-bottom: 3px; } .log li:last-child { font-weight: 700; }
.cap { font-weight: 700; margin-bottom: 6px; min-height: 1.5em; }
.e.cur { stroke: var(--n-current); stroke-width: 4; } .ah.cur { fill: var(--n-current); }
.hgrid { display: grid; gap: 5px; width: 100%; max-width: 680px; }
.cell { aspect-ratio: 1; min-height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--n-idle); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; color: var(--ink); padding: 0; line-height: 1.1; }
.cell.fog { opacity: 0.4; }
.cell.nb { border: 2px dashed var(--amber); cursor: pointer; background: var(--amber-soft); font: inherit; font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; color: var(--ink); }
.cell.nb.known.up { border-style: solid; border-color: var(--good); background: var(--good-soft); }
.cell.nb.known.down { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.cell.here { border-color: var(--ink); background: var(--n-current); color: var(--on-strong); }
.cell small { font-size: 0.72rem; font-weight: 700; }
.cell .ball { position: absolute; top: 2px; left: 3px; font-size: 0.62rem; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 0 6px; font-family: var(--font-ui); }
.cell .tag2 { position: absolute; bottom: 1px; right: 3px; font-size: 0.58rem; font-family: var(--font-ui); font-weight: 800; }
.cell .dot { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: 0.55; }
.cell .arrow { position: absolute; top: 1px; right: 4px; font-size: 0.85rem; opacity: 0.75; }
.opt.sel { border-color: var(--primary); background: var(--soft); }
.xbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.xbar i { display: block; height: 100%; background: var(--primary); transition: width 0.3s; }
.xtag { align-self: flex-start; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; color: var(--primary); background: var(--soft); border-radius: 999px; padding: 3px 12px; }
.xtext { font: inherit; width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.xtext:disabled { opacity: 0.8; }
.rev { border-bottom: 1px solid var(--line); padding: 6px 0; }
.rev summary { cursor: pointer; font-size: 0.92rem; }
.rev .revbody { padding: 8px 4px 4px; }
.ctx { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; color: var(--muted); }
.ctx b, .how b.t { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); margin-bottom: 2px; }
.how { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.how b.t { margin-bottom: 4px; }
pre.code { background: var(--bg); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-family: var(--font-data); font-size: 0.82rem; margin: 0; line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  ['problemas', '¿Qué tienen en común todos los problemas de búsqueda?', ['Situación inicial → alternativas → diferentes estados → objetivo', 'Todos usan redes neuronales', 'Todos requieren datos de entrenamiento', 'Todos tienen un único estado posible'], 0, 'Diapositiva 5: un problema de búsqueda tiene situación inicial, alternativas, diferentes estados y un objetivo.'],
  ['problemas', '¿Cuál de estos elementos NO se define al formalizar un problema de búsqueda?', ['Estado inicial', 'Acciones y transiciones', 'Objetivo y costo', 'Función de activación de una neurona'], 3, 'Los seis elementos son: estado inicial, estados, acciones, transición, objetivo y costo.'],
  ['problemas', 'En el ejemplo del robot en una cuadrícula (diapositiva 8), ¿qué son los estados?', ['Las posiciones (celdas) donde puede estar el robot', 'Solo los muros', 'Los movimientos permitidos', 'El costo de cada paso'], 0, 'Estados = posiciones. Las acciones son ↑ ↓ ← →, el objetivo es G y el costo es 1 por movimiento.'],
  ['problemas', 'En el ejemplo del robot, ¿cuáles son las acciones?', ['↑ ↓ ← →', 'Limpiar y vaciar', 'Sumar y restar', 'Leer y escribir'], 0, 'El robot se mueve arriba, abajo, izquierda o derecha.'],
  ['problemas', 'En la navegación GPS (Waze, Google Maps), ¿qué representa el costo?', ['El tiempo estimado en minutos', 'La ubicación GPS actual', 'Los giros en intersecciones', 'La dirección de destino'], 0, 'Diapositiva 7: estado = ubicación GPS, acciones = giros, meta = dirección de destino, costo = tiempo estimado.'],
  ['problemas', 'En el 8-puzzle, ¿cuál es la acción disponible?', ['Deslizar la ficha vacía', 'Eliminar una ficha', 'Girar todo el tablero', 'Sumar los números'], 0, 'En el 8-puzzle la acción es deslizar la ficha vacía; el costo es el número de movimientos.'],
  ['problemas', 'En el 8-puzzle, ¿qué se toma como costo?', ['El número de movimientos', 'La suma de los números del tablero', 'El tiempo de CPU', 'El número de fichas'], 0, 'Cada movimiento de la ficha vacía cuesta 1, así que el costo es el número de movimientos.'],
  ['problemas', 'En el problema de la aspiradora inteligente, ¿cuál es la meta?', ['100% del área limpia', 'Llegar a la cocina', 'Gastar toda la batería', 'Encontrar un mueble'], 0, 'Diapositiva 7: meta = 100% del área limpia; costo = batería y movimientos.'],
  ['problemas', 'En la logística de entregas (Amazon, Uber Eats), ¿qué se usa como costo?', ['La distancia o combustible total', 'Las paradas completadas', 'Visitar al siguiente cliente', 'Entregar todos los paquetes'], 0, 'Estado = paradas completadas, acción = visitar al siguiente cliente, meta = entregar todos los paquetes, costo = distancia/combustible.'],
  ['estados', '¿Qué hace la abstracción en un problema de búsqueda?', ['Elimina detalles innecesarios y conserva lo necesario para buscar una solución', 'Agrega todos los detalles del mundo real', 'Convierte el problema en una red neuronal', 'Elimina el estado objetivo'], 0, 'Diapositiva 11: mundo real → modelo formal → espacio de búsqueda; la abstracción conserva solo lo necesario.'],
  ['estados', '¿Qué es el espacio de estados?', ['El conjunto de todas las configuraciones posibles del problema', 'Solo los estados que ya se visitaron', 'El camino solución', 'La lista de acciones'], 0, 'Es el conjunto de todas las configuraciones posibles que puede tener el problema (diapositiva 10).'],
  ['estados', '¿En qué representación un mismo estado puede aparecer en varios nodos?', ['En el árbol de búsqueda', 'En el grafo de estados', 'En ninguna', 'En ambas por igual'], 0, 'El árbol representa caminos: el mismo estado puede aparecer varias veces. En el grafo de estados aparece una sola vez.'],
  ['estados', '¿Qué estructura puede contener ciclos y rutas infinitas?', ['El grafo de estados', 'El árbol de búsqueda ya generado', 'Ninguna', 'La lista de visitados'], 0, 'El grafo de estados es la estructura sobre la que se define el problema y puede tener ciclos.'],
  ['estados', '¿Qué son las hojas de un árbol de búsqueda?', ['Nodos aún no expandidos', 'El estado inicial', 'Nodos ya visitados', 'El camino solución'], 0, 'Raíz = estado inicial; hojas = nodos aún no expandidos.'],
  ['local', '¿Qué caracteriza a la búsqueda local?', ['Modifica iterativamente un único estado actual generando vecinos', 'Guarda todos los caminos en una cola', 'Explora siempre todo el espacio de estados', 'Necesita conocer el mapa completo'], 0, 'Diapositiva 16: algoritmos de optimización que modifican iterativamente un único estado actual con pequeños cambios.'],
  ['local', 'En Hill Climbing, la "decisión directa" significa:', ['Se mueve a la mejor opción cercana y olvida los pasos anteriores', 'Retrocede al nodo anterior', 'Expande por niveles', 'Usa una cola de prioridad'], 0, 'Diapositiva 15: ubicación actual, exploración cercana (vecinos directos) y decisión directa.'],
  ['local', '¿Qué es un máximo local?', ['Un pico más bajo que el mejor, donde todos los vecinos son peores', 'El mejor valor de todo el espacio', 'Una zona plana sin cambios', 'El estado inicial'], 0, 'Hill Climbing se detiene en él aunque exista un máximo global más alto.'],
  ['local', '¿Cómo se llama una zona plana en la cima donde todos los vecinos valen lo mismo?', ['Máximo local plano', 'Máximo global', 'Terraza', 'Cresta'], 0, 'Diapositiva 17: máximo global, máximo local, máximo local plano y terraza.'],
  ['local', '¿Qué es una terraza en el paisaje de Hill Climbing?', ['Una zona plana desde la que todavía se puede subir más', 'Un pico local', 'El máximo global', 'Un estado sin vecinos'], 0, 'Es plana, pero a diferencia del máximo local plano, desde ella todavía hay camino ascendente.'],
  ['local', 'En el 8-puzzle con h(n) = fichas mal colocadas, ¿cuánto vale h en el estado objetivo?', ['0', '1', '8', '9'], 0, 'El objetivo no tiene fichas mal colocadas: h(n) = 0.'],
  ['local', 'Con meta [1 2 3 / 4 5 6 / 7 8 _] y tablero [1 2 3 / _ 4 6 / 7 5 8], ¿cuánto vale h (fichas mal colocadas, sin contar el hueco)?', ['3', '2', '4', '0'], 0, 'Están mal el 4, el 5 y el 8; el 6 y el 7 ya están en su sitio. h = 3 (diapositiva 18).'],
  ['local', '¿Qué dos soluciones se vieron cuando Hill Climbing se atasca en el 8-puzzle?', ['Reinicio aleatorio y cambiar la heurística (Manhattan)', 'Usar BFS y DFS', 'Aumentar el costo y reducir los estados', 'Borrar el estado objetivo'], 0, 'Diapositivas 28 y 29: opción 1, reinicio aleatorio; opción 2, cambiar la heurística por distancia Manhattan.'],
  ['local', '¿Qué mide la distancia Manhattan h₂ en el 8-puzzle?', ['La suma, para cada ficha, de filas más columnas que le faltan para llegar a su lugar', 'El número de fichas mal colocadas', 'El número de movimientos realizados', 'La diagonal más corta'], 0, 'h₂ suma |fila − fila_meta| + |col − col_meta| de cada ficha.'],
  ['local', 'En el ejercicio de la ruta de ciudades (diapositivas 31 y 32), ¿cómo se genera un vecino?', ['Intercambiando la posición de dos ciudades en la ruta', 'Quitando una ciudad', 'Agregando una ciudad nueva', 'Cambiando la distancia entre ciudades'], 0, 'Un vecino se genera intercambiando la posición de 2 ciudades en la ruta.'],
  ['local', 'En el ejercicio de la ruta de ciudades (diapositivas 31 y 32), ¿qué se minimiza?', ['La distancia total de la ruta circular', 'El número de ciudades', 'El número de cruces', 'La altura'], 0, 'Se busca la ruta circular que visite todas las ciudades una vez y regrese al origen con la menor distancia total.'],
  ['local', 'Para f(x) = −x² + 4x (diapositiva 33), ¿dónde está el máximo?', ['(2, 4)', '(4, 0)', '(0, 0)', '(1, 3)'], 0, 'f(2) = −4 + 8 = 4, y es el punto más alto de la parábola.'],
  ['local', 'Hill Climbing es...', ['Rápido y de poca memoria, pero puede quedarse en óptimos locales', 'Siempre óptimo', 'Siempre completo', 'Un algoritmo de búsqueda ciega'], 0, 'Solo guarda el estado actual; por eso usa poca memoria, pero puede atascarse.'],
  ['ciega', '¿Qué significa que BFS, DFS y UCS sean búsqueda ciega?', ['Exploran sin saber qué tan cerca o lejos están de la solución', 'No usan ninguna estructura de datos', 'No tienen estado inicial', 'Solo funcionan en laberintos'], 0, 'Siguen una regla de exploración fija sin información sobre la cercanía a la meta (diapositiva 34).'],
  ['bfs', '¿Cómo explora BFS?', ['Todos los nodos de un nivel antes de pasar al siguiente', 'Lo más profundo posible antes de retroceder', 'Primero el nodo de menor costo', 'Se mueve al mejor vecino'], 0, 'Diapositiva 35: explora todos los nodos de un nivel antes de pasar al nivel de profundidad siguiente.'],
  ['dfs', '¿Cómo explora DFS?', ['Avanza tan profundo como sea posible por una rama antes de retroceder', 'Todos los nodos de un nivel antes de pasar al siguiente', 'Primero el nodo de menor costo', 'Evalúa solo a los vecinos y olvida el camino'], 0, 'Diapositiva 36: avanza tan profundo como sea posible a lo largo de una rama antes de retroceder.'],
  ['ucs', '¿Qué nodo explora primero UCS?', ['El de menor costo acumulado desde el estado inicial', 'El más antiguo de la cola', 'El último que entró', 'El que esté más cerca de la meta en línea recta'], 0, 'Diapositiva 42: explora primero el nodo cuyo costo acumulado g(n) es menor.'],
  ['bfs', '¿Qué estructura de datos usa BFS?', ['Cola (FIFO)', 'Pila (LIFO)', 'Cola de prioridad', 'Ninguna'], 0, 'Sale primero el nodo que lleva más tiempo esperando.'],
  ['dfs', '¿Qué estructura de datos usa DFS (con pila explícita)?', ['Pila (LIFO)', 'Cola (FIFO)', 'Cola de prioridad', 'Montículo máximo'], 0, 'El último en entrar es el primero en salir.'],
  ['ucs', '¿Qué estructura de datos usa UCS?', ['Cola de prioridad', 'Pila', 'Cola simple', 'Árbol AVL'], 0, 'Se ordena por costo acumulado g(n); sale el menor.'],
  ['ciega', 'Para el árbol 0→{1, 2}, 1→{3, 4}, 2→{5} (diapositiva 37), ¿qué salida produce DFS?', ['0, 1, 3, 4, 2, 5', '0, 1, 2, 3, 4, 5', '0, 2, 5, 1, 3, 4', '5, 4, 3, 2, 1, 0'], 0, 'DFS baja por la rama del 1 (3 y 4), luego retrocede al 2 y su hijo 5. BFS daría 0, 1, 2, 3, 4, 5.'],
  ['bfs', 'Según GeeksforGeeks, ¿cuál es la complejidad en tiempo de BFS?', ['O(V + E)', 'O(V²)', 'O(log V)', 'O(E²)'], 0, 'Cada vértice y cada arista se procesan una vez.'],
  ['bfs', 'Según GeeksforGeeks, ¿cuál es el espacio auxiliar de BFS?', ['O(V)', 'O(1)', 'O(E²)', 'O(log V)'], 0, 'Se necesita la cola y el arreglo de visitados.'],
  ['bfs', '¿Cuál es una aplicación de BFS?', ['Encontrar el camino más corto en un grafo sin pesos', 'Entrenar redes neuronales', 'Ordenar números', 'Comprimir archivos'], 0, 'También sirve para detectar ciclos y es la base de Dijkstra, Kahn (orden topológico) y Prim.'],
  ['ciega', '¿Cómo se recorre un grafo desconectado completo con BFS o DFS?', ['Se lanza el algoritmo desde cada nodo que no haya sido visitado', 'Una sola ejecución basta', 'Es imposible', 'Se cambia a Hill Climbing'], 0, 'Una sola ejecución solo alcanza su componente conexa; se comparte el arreglo de visitados.'],
  ['ciega', '¿Por qué se usa un arreglo o conjunto de visitados en BFS y DFS?', ['Porque los ciclos podrían hacer que un nodo se procese más de una vez', 'Para ordenar los nodos', 'Para calcular heurísticas', 'Para dibujar el grafo'], 0, 'Sin él, un grafo con ciclos produciría bucles infinitos.'],
  ['bfs', 'En el código de clase, ¿qué método saca el nodo que lleva más tiempo en la cola de BFS?', ['popleft()', 'pop()', 'heappop()', 'remove()'], 0, 'deque.popleft() saca por la izquierda (FIFO); pop() saca el último (usado en DFS).'],
  ['dfs', 'En el DFS de clase con pila, ¿qué método saca el último elemento?', ['pop()', 'popleft()', 'heappop()', 'insert()'], 0, 'pila.pop() saca el último en entrar.'],
  ['ucs', '¿Por qué en el UCS de clase la tupla es (costo, nodo, camino)?', ['Porque heapq ordena por el primer elemento, el costo acumulado', 'Porque Python lo exige', 'Para que el camino salga primero', 'Por estética'], 0, 'heapq compara tuplas empezando por el primer elemento.'],
  ['ucs', '¿Cuándo se comprueba si el nodo es el objetivo en UCS?', ['Al sacarlo de la cola de prioridad', 'Al meterlo en la cola', 'Antes de empezar', 'Nunca'], 0, 'Al sacarlo se garantiza que no existe un camino más barato todavía sin explorar.'],
  ['ucs', '¿Qué algoritmo garantiza el camino de menor costo con costos positivos?', ['UCS', 'BFS', 'DFS', 'Hill Climbing'], 0, 'UCS expande por costo acumulado creciente.'],
  ['bfs', 'BFS garantiza encontrar el camino con...', ['El menor número de aristas', 'El menor costo siempre', 'La mayor profundidad', 'Ninguna garantía'], 0, 'BFS cuenta aristas, no costos.'],
  ['casos', '¿Qué algoritmo de búsqueda ciega garantiza encontrar ese camino con el menor número de movimientos?', ['BFS (búsqueda en amplitud)', 'DFS (búsqueda en profundidad)', 'Hill Climbing', 'Ninguno puede garantizarlo'], 0, 'Cuando todos los movimientos cuestan lo mismo, el camino con menos movimientos es el de menos aristas, y BFS explora por niveles, así que llega primero por él. UCS también serviría, pero BFS es más simple.', 'Un robot está en un laberinto representado como una cuadrícula con muros. Cada movimiento (arriba, abajo, izquierda o derecha) cuesta lo mismo. El robot debe llegar a la salida con el menor número de movimientos posible.'],
  ['casos', '¿Qué algoritmo de búsqueda elegirías para obtener el recorrido de menor distancia total?', ['UCS (búsqueda de costo uniforme)', 'BFS', 'DFS', 'Hill Climbing'], 0, 'Las calles tienen distancias distintas, así que hay que minimizar la suma de costos, no el número de calles. UCS expande siempre el nodo de menor costo acumulado g(n). BFS solo cuenta aristas.', 'Un repartidor debe ir de la bodega a la casa de un cliente. La ciudad se modela como un grafo: cada cruce es un nodo y cada calle es una arista con su distancia en km, distinta en cada calle. Se quiere el recorrido de menor distancia total.'],
  ['casos', '¿Qué estrategia de búsqueda ciega se parece más a ese comportamiento?', ['DFS: avanza lo más profundo posible y retrocede cuando hay un conflicto', 'BFS: prueba todos los números de todas las casillas a la vez, nivel por nivel', 'UCS: elige siempre el número más barato', 'Hill Climbing: se queda con el primer número que no choca'], 0, 'Probar una opción, avanzar y retroceder (backtracking) al llegar a un callejón sin salida es justo lo que hace DFS con su pila.', 'Un programa resuelve un Sudoku probando un número en una casilla, avanzando a la siguiente y, si descubre un conflicto con las reglas, retrocede para probar otro número.'],
  ['casos', '¿Qué tipo de algoritmo es adecuado para mejorar ese tablero?', ['Búsqueda local (Hill Climbing): mover una reina a la vez y quedarse con el mejor tablero vecino', 'BFS desde un tablero vacío, guardando todos los caminos', 'UCS con costo igual a la distancia entre reinas', 'Ningún algoritmo de búsqueda sirve para este problema'], 0, 'El estado ya es una configuración completa y se mejora con cambios pequeños: es el caso típico de búsqueda local. Las N-reinas son un ejemplo que aparece en la presentación.', 'Se quiere acomodar 8 reinas en un tablero de ajedrez sin que se ataquen. Se parte de un tablero con las 8 reinas ya colocadas (una por columna), algunas se atacan, y se prueba mover una reina a la vez para reducir los ataques.'],
  ['casos', '¿Qué podrías hacer para seguir intentando resolver el tablero?', ['Usar un reinicio aleatorio o cambiar la heurística por la distancia Manhattan', 'Aumentar el costo de cada movimiento', 'Borrar el estado objetivo', 'Declarar el tablero como solución'], 0, 'Es una meseta o un óptimo local. Las dos salidas vistas son el reinicio aleatorio y una heurística que distinga mejor los estados, como Manhattan.', 'Un programa resuelve el 8-puzzle con Hill Climbing y h₁ (fichas mal colocadas). En cierto tablero, todos los vecinos tienen el mismo h₁ que el tablero actual, y el programa se detiene sin llegar a la meta.'],
  ['casos', '¿Qué algoritmo describe este procedimiento?', ['Hill Climbing (búsqueda local)', 'BFS', 'DFS', 'UCS'], 0, 'Se parte de una solución completa (una ruta), se generan vecinos (intercambiar dos ciudades) y se queda con el mejor mientras mejore: es Hill Climbing.', 'Una empresa quiere una ruta circular que pase por 5 ciudades una sola vez y regrese a la ciudad de inicio, con la menor distancia total. Se parte de una ruta cualquiera y se prueban intercambios de dos ciudades, quedándose con el cambio que más acorte la ruta.'],
  ['casos', '¿Qué estructura de datos usarías para guardar los nodos pendientes?', ['Una cola de prioridad (por ejemplo, heapq en Python)', 'Una pila (LIFO)', 'Una cola simple (FIFO)', 'Una matriz de visitados únicamente'], 0, 'Hay que sacar siempre el nodo de menor costo acumulado g(n): eso lo resuelve una cola de prioridad.', 'Estás implementando una búsqueda en la que siempre se debe explorar primero el nodo cuyo costo acumulado desde el inicio es el menor.'],
  ['casos', '¿Qué estructura de datos usarías para guardar los nodos pendientes?', ['Una cola (FIFO)', 'Una pila (LIFO)', 'Una cola de prioridad', 'Un árbol binario'], 0, 'Explorar por niveles exige sacar primero el nodo que lleva más tiempo esperando: una cola.', 'Quieres explorar un grafo por niveles: primero los vecinos del nodo inicial, luego los vecinos de esos vecinos, y así sucesivamente.'],
  ['casos', '¿Cuál es una definición adecuada del costo del problema?', ['El tiempo estimado de cada tramo del recorrido', 'La dirección de la escuela', 'El número de calles de la ciudad', 'El nombre de la aplicación'], 0, 'En navegación GPS el costo suele ser el tiempo estimado; la meta es el destino y las acciones son los giros.', 'Estás formalizando como problema de búsqueda el trayecto de tu casa a la escuela con una aplicación de mapas.'],
  ['casos', '¿Cuál es una definición adecuada de estado?', ['La posición (fila, columna) donde está el robot', 'Solo la casilla de la meta', 'El color del robot', 'El número de muros de la cuadrícula'], 0, 'El estado debe describir lo que cambia al actuar: aquí, la posición actual del robot.', 'Un robot se mueve por una cuadrícula con muros desde una casilla inicial S hasta una meta G. Vas a formalizar el problema.'],
  ['casos', '¿Qué detalle conviene eliminar al hacer la abstracción del problema?', ['El color de los muros y la marca de la aspiradora', 'Qué casillas están libres y cuáles tienen muebles', 'Los movimientos permitidos', 'Qué casillas ya se limpiaron'], 0, 'La abstracción elimina lo innecesario (color, marca) y conserva lo que afecta la búsqueda (casillas libres, acciones, qué está limpio).', 'Vas a modelar una aspiradora robótica que limpia una habitación con muebles. Debes decidir qué detalles del mundo real conservar y cuáles eliminar.'],
  ['casos', '¿Qué algoritmo es adecuado para encontrar un máximo de f(x) en esta situación?', ['Hill Climbing: comparar f en x con los vecinos x + 0.1 y x − 0.1 y moverse al mejor', 'BFS sobre todos los valores posibles de x', 'UCS con costo f(x)', 'DFS sobre la gráfica completa'], 0, 'Solo se conoce el valor en el punto actual y en sus vecinos cercanos: es el escenario de la búsqueda local.', 'Quieres encontrar el máximo de una función f(x), pero solo puedes evaluar f en el punto actual x y en los puntos cercanos x + 0.1 y x − 0.1. No conoces la forma de la gráfica.'],
  ['casos', '¿Cuál de los dos resultados es probablemente el de UCS?', ['El de 5 aristas y costo 9', 'El de 3 aristas y costo 20', 'Ambos, siempre dan lo mismo', 'Ninguno'], 0, 'UCS minimiza el costo, no el número de aristas. El otro resultado, con menos aristas, es el típico de BFS.', 'Dos algoritmos de búsqueda ciega buscan un camino de A a G en el mismo grafo con costos. Uno devuelve un camino de 3 aristas con costo total 20, y el otro devuelve un camino de 5 aristas con costo total 9.'],
  ['casos', '¿Qué algoritmo podría tardar mucho por explorar primero la rama larga?', ['DFS', 'BFS', 'UCS con costos iguales', 'Ninguno'], 0, 'DFS baja lo más profundo posible por una rama antes de retroceder. BFS encontraría la meta cercana primero porque explora por niveles.', 'Un grafo tiene dos ramas desde el nodo inicial: una muy larga (casi sin fin) y otra corta, donde la meta está a solo 2 aristas del inicio. Los vecinos se visitan en orden y la rama larga se visita primero.'],
  ['casos', '¿Qué falta en la implementación?', ['Un conjunto de nodos visitados', 'Una función de costo', 'Una heurística', 'Un segundo grafo'], 0, 'Sin visitados, los ciclos hacen que un nodo se vuelva a procesar indefinidamente.', 'Un programa recorre un grafo con ciclos (por ejemplo, A → B → C → A) usando una cola. El programa nunca termina porque vuelve a meter una y otra vez los mismos nodos.'],
  ['casos', '¿Qué debes hacer para visitar todos los nodos?', ['Lanzar BFS desde cada nodo que aún no haya sido visitado', 'Nada: una sola ejecución siempre visita todo', 'Cambiar a Hill Climbing', 'Eliminar la cola'], 0, 'Una ejecución solo alcanza su componente conexa. Hay que recorrer todos los nodos y lanzar BFS desde los no visitados, compartiendo el conjunto de visitados.', 'Una red tiene dos islas de nodos sin conexión entre sí. Ejecutas BFS desde un nodo de la primera isla y descubres que los nodos de la segunda isla nunca se visitan, pero quieres visitar todos.']
];

function examResult(ex) {
