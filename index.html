<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestro de Búsqueda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: mapa de mundos -> nivel. En un nivel, el grafo a la izquierda y la estructura de datos con las acciones del jugador a la derecha. */
:root {
  --font-ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --surface: #ffffff;
  --ink: #17203a;
  --muted: #5d6685;
  --line: #d8dcec;
  --primary: #2456e6;
  --on-primary: #ffffff;
  --soft: #e6ecff;
  --good: #12805c;
  --good-soft: #d9f3e8;
  --bad: #c42b2b;
  --bad-soft: #fde2e2;
  --amber: #f2a900;
  --amber-soft: #fff1c9;
  --n-idle: #e7eaf5;
  --n-frontier: #f6d27a;
  --n-current: #2456e6;
  --n-done: #bfe3d2;
  --n-path: #12805c;
  --on-strong: #ffffff;
  --edge: #8a93b2;
  --w1: #7a55e8; --w2: #1d8fd1; --w3: #e0662b; --w4: #12805c; --w5: #c93d86; --w6: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #171f35; --ink: #e8ecf8; --muted: #9aa5c7; --line: #2a3556;
    --primary: #7b9bff; --on-primary: #0a1020; --soft: #1f2c55; --good: #3fd09a; --good-soft: #14392d;
    --bad: #ff8080; --bad-soft: #432024; --amber: #f6c244; --amber-soft: #43380f;
    --n-idle: #27304d; --n-frontier: #a47a14; --n-current: #7b9bff; --n-done: #2b5a47; --n-path: #3fd09a;
    --on-strong: #0a1020; --edge: #6e789c;
    --w1: #a78bfa; --w2: #55b6ee; --w3: #f59063; --w4: #3fd09a; --w5: #ee7fb6; --w6: #9ca3af;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #171f35; --ink: #e8ecf8; --muted: #9aa5c7; --line: #2a3556;
  --primary: #7b9bff; --on-primary: #0a1020; --soft: #1f2c55; --good: #3fd09a; --good-soft: #14392d;
  --bad: #ff8080; --bad-soft: #432024; --amber: #f6c244; --amber-soft: #43380f;
  --n-idle: #27304d; --n-frontier: #a47a14; --n-current: #7b9bff; --n-done: #2b5a47; --n-path: #3fd09a;
  --on-strong: #0a1020; --edge: #6e789c;
  --w1: #a78bfa; --w2: #55b6ee; --w3: #f59063; --w4: #3fd09a; --w5: #ee7fb6; --w6: #9ca3af;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
h3 { font-size: 1.15rem; font-weight: 800; }
p { margin: 0 0 8px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 8px 15px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--primary); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.sm { padding: 5px 11px; font-size: 0.9rem; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-data); }
/* barra superior */
.topbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.topbar .title { display: flex; flex-direction: column; min-width: 0; }
.topbar .kicker { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 800; color: var(--muted); }
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-family: var(--font-data); font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
/* mapa */
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.world { display: flex; flex-direction: column; gap: 10px; }
.world .head { display: flex; gap: 12px; align-items: center; }
.badge { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--wc); font-family: var(--font-data); font-size: 0.95rem; }
:root[data-theme="dark"] .badge { color: #0a1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #0a1020; } }
.world p { color: var(--muted); font-size: 0.92rem; margin: 0; }
.lvls { display: flex; flex-wrap: wrap; gap: 8px; }
.lvl { font: inherit; font-weight: 700; font-size: 0.9rem; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.lvl:hover { border-color: var(--wc); }

.stars { color: var(--amber); letter-spacing: 1px; font-size: 0.95rem; }

.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0, 1fr); } }
svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }

.ah { fill: var(--edge); } .ah.on { fill: var(--n-path); }
.w { font-family: var(--font-data); font-size: 12px; font-weight: 700; fill: var(--ink); stroke: var(--surface); stroke-width: 4px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
.nd circle { stroke: var(--edge); stroke-width: 1.5; fill: var(--n-idle); }
.nd text { font-family: var(--font-data); font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.nd.frontier circle { fill: var(--n-frontier); } .nd.done circle { fill: var(--n-done); }
.nd.current circle { fill: var(--n-current); stroke: var(--ink); stroke-width: 3; } .nd.path circle { fill: var(--n-path); }
.nd.current text, .nd.path text { fill: var(--on-strong); }
.nd.nbr circle { stroke: var(--amber); stroke-width: 3.5; stroke-dasharray: 5 3; }
.tag { font-family: var(--font-ui); font-size: 11px; font-weight: 800; fill: var(--muted); text-anchor: middle; text-transform: uppercase; letter-spacing: 0.05em; }
/* estructuras */
.tok { font-family: var(--font-data); font-weight: 700; font-size: 1.05rem; min-width: 46px; min-height: 46px; padding: 4px 10px; border-radius: 10px; background: var(--n-frontier); color: var(--ink);
  border: 2px solid var(--ink); cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; animation: pop 0.18s ease-out; }
.tok small { font-size: 0.68rem; font-weight: 500; }
.tok.sm { min-width: 40px; min-height: 40px; font-size: 0.95rem; background: var(--n-idle); }
.tok.used { opacity: 0.35; cursor: default; }
.tok.static { cursor: default; }
@keyframes pop { from { transform: scale(0.6); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
.qwrap { display: flex; align-items: center; gap: 8px; }
.qrow { display: flex; gap: 6px; flex: 1; min-height: 62px; padding: 7px; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); overflow-x: auto; align-items: center; }
.qlab { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: center; line-height: 1.2; flex: none; width: 52px; }
.swrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.scol { display: flex; flex-direction: column; gap: 5px; min-height: 90px; width: 160px; padding: 8px 8px 8px; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); border-radius: 0 0 10px 10px; align-items: stretch; justify-content: flex-start; }
.scol .tok { width: 100%; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; min-height: 70px; padding: 10px; border: 3px dashed var(--ink); border-radius: 12px; align-items: center; }
.sempty { color: var(--muted); font-style: italic; font-size: 0.88rem; margin: auto; }
.pulse { animation: pulse 1s ease-in-out infinite; outline: 3px solid var(--amber); outline-offset: 2px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,0,0.7); } 50% { box-shadow: 0 0 0 9px rgba(242,169,0,0); } }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; align-items: center; }
.chip { font-family: var(--font-data); font-size: 0.86rem; padding: 2px 9px; border-radius: 6px; background: var(--n-idle); border: 1px solid var(--line); }
.chip.res { background: var(--n-done); border-color: transparent; }
.empty { color: var(--muted); font-style: italic; font-size: 0.86rem; }
.fb { border-radius: 10px; padding: 10px 12px; font-weight: 600; background: var(--soft); }
.fb.ok { background: var(--good-soft); } .fb.err { background: var(--bad-soft); animation: shake 0.3s; }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
.coach { border: 2px solid var(--amber); background: var(--amber-soft); border-radius: 12px; padding: 10px 12px; }
.coach b.t { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.prog { font-family: var(--font-data); font-size: 0.82rem; background: var(--bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.prog .cur { background: var(--amber-soft); font-weight: 700; border-radius: 4px; padding: 0 4px; }
.prog .past { color: var(--muted); }
.result h3 { margin-bottom: 4px; }
/* intro */
.card { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.card .vis { background: var(--bg); border-radius: 12px; padding: 14px; overflow-x: auto; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--primary); }
/* colina */
.bar { fill: var(--n-done); stroke: var(--edge); stroke-width: 1; } .bar.fog { fill: var(--n-idle); opacity: 0.55; stroke: none; }
.bar.here { fill: var(--n-current); } .bar.glob { fill: var(--n-path); } .bar.loc { fill: var(--n-frontier); }
.vl { font-family: var(--font-data); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; max-width: 230px; }
.board.mini { max-width: 104px; gap: 3px; }
.tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; position: relative; background: var(--n-idle); border: 2px solid var(--line); border-radius: 8px; font-family: var(--font-data); font-weight: 700; font-size: 1.5rem; }
.mini .tile { font-size: 0.9rem; border-width: 1.5px; border-radius: 5px; }
.tile.hole { background: transparent; border-style: dashed; }
.nbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.nb { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 5px; align-items: center; font-size: 0.8rem; text-align: center; cursor: pointer; }
.nb:hover { border-color: var(--primary); }
.hnum { font-family: var(--font-data); font-weight: 700; }
input[type="number"] { font: inherit; font-family: var(--font-data); width: 84px; padding: 7px 9px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
/* quiz */
.opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { font: inherit; font-weight: 600; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px 13px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const collate = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
const rnd = n => Math.floor(Math.random() * n);

/* ---------- progreso guardado (solo conveniencia del navegador) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem('maestro-busqueda') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('maestro-busqueda', JSON.stringify(o)); } catch (e) { /* sin almacenamiento */ } }
};
let prog = store.get();
const saveLevel = (id, stars) => { const old = prog[id] || { stars: 0 }; prog[id] = { done: true, stars: Math.max(old.stars || 0, stars) }; store.set(prog); };
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const starsFor = pts => (pts <= 0 ? 3 : pts <= 2 ? 2 : 1);

/* =====================================================================
   Datos: grafos
   ===================================================================== */
const GR = {
  tree: { directed: false, nodes: { A: [320,40], B: [200,130], C: [440,130], D: [130,225], E: [270,225], F: [440,225], G: [90,310] },
    edges: [['A','B',1],['A','C',1],['B','D',1],['B','E',1],['C','F',1],['D','G',1]] },
  g41R: { directed: false, nodes: { A: [80,190], B: [250,70], C: [250,300], D: [520,70], E: [520,300] },
    edges: [['A','B',1],['A','C',1],['B','C',1],['B','D',1],['C','E',1],['D','E',1]] },
  g41L: { directed: false, nodes: { '0': [320,40], '3': [190,110], '1': [450,110], '2': [320,190], '4': [190,270], '5': [450,270], '6': [320,320] },
    edges: [['0','1',1],['0','3',1],['1','2',1],['1','5',1],['1','6',1,{bend:-60}],['2','3',1],['2','4',1],['2','5',1],['3','4',1],['4','6',1]] },
  d44: { directed: true, nodes: { A: [50,200], B: [165,120], C: [260,290], D: [290,120], G: [410,115], E: [540,55], F: [420,210], H: [590,210] },
    edges: [['A','B',1],['A','C',8],['B','D',1],['B','E',3,{bend:70}],['C','F',2],['D','F',1],['D','G',6],['E','H',7],['F','B',2],['F','H',2],['G','E',1]] },
  d45: { directed: true, nodes: { A: [50,170], B: [160,110], C: [300,35], D: [160,230], E: [300,175], F: [430,110], G: [300,290], H: [430,205], I: [430,300], J: [580,170] },
    edges: [['A','B',2],['A','C',9,{bend:70}],['A','D',1],['B','E',3],['B','F',8],['C','J',12,{bend:50}],['D','E',1],['D','G',7],['E','F',1],['E','H',5],['F','J',2],['G','H',1],['G','I',4],['H','J',1],['I','J',6]] },
  d42: { directed: true, nodes: { S: [60,270], A: [170,170], B: [300,60], C: [300,230], D: [440,150], G: [570,270] },
    edges: [['S','A',1],['S','G',12,{bend:-50}],['A','B',3],['A','C',1],['B','D',3],['C','D',1],['C','G',2],['D','G',3]] },
  u13: { directed: false, nodes: { S: [50,170], A: [170,60], B: [330,60], C: [490,60], D: [200,285], E: [340,285], F: [480,285], G: [590,190] },
    edges: [['S','A',3],['S','D',4],['A','B',4],['A','D',5],['B','C',4],['B','E',5],['D','E',2],['E','F',4],['F','G',3]] },
  u43: { directed: false, nodes: { A: [60,170], B: [220,60], C: [220,285], D: [430,60], E: [430,285], F: [580,170] },
    edges: [['A','B',9],['A','C',4],['B','C',2],['B','D',7],['B','E',3,{lt:0.3}],['C','D',1,{lt:0.3}],['C','E',6],['D','E',4],['D','F',8],['E','F',2]] }
};
Object.values(GR).forEach(g => {
  g.adj = {}; Object.keys(g.nodes).forEach(n => (g.adj[n] = []));
  g.edges.forEach(([u, v, w]) => { g.adj[u].push({ to: v, w }); if (!g.directed) g.adj[v].push({ to: u, w }); });
  Object.keys(g.adj).forEach(n => g.adj[n].sort((a, b) => collate(a.to, b.to)));
});

/* =====================================================================
   Motor: BFS / DFS / UCS jugados a mano
   ===================================================================== */
function SearchGame(lv) {
  const g = GR[lv.graph], adj = g.adj, algo = lv.algo, goal = lv.goal || '';
  const S = { algo, goal, struct: [{ n: lv.start, g: 0, path: [lv.start] }], visited: algo === 'bfs' ? [lv.start] : [], result: [], cur: null, curItem: null,
    phase: 'pop', expectDecision: null, expectPush: [], pushed: [], done: false, won: false, path: null, cost: null, mistakes: 0, hints: 0, fb: null, showHint: false, steps: 0 };
  const err = m => { S.mistakes++; S.fb = { t: 'err', m }; return { ok: false }; };
  const info = m => { S.fb = { t: 'info', m }; return { ok: false }; };
  const good = m => { S.fb = { t: 'ok', m }; S.showHint = false; return { ok: true }; };
  const cmp = (a, b) => a.g - b.g || collate(a.n, b.n) || collate(a.path.join(), b.path.join());
  const word = algo === 'ucs' ? 'expandido' : 'visitado';
  function expectedPop() {
    if (algo === 'bfs') return 0;
    if (algo === 'dfs') return S.struct.length - 1;
    let b = 0; S.struct.forEach((it, i) => { if (cmp(it, S.struct[b]) < 0) b = i; }); return b;
  }
  function checkEmpty() {
    if (S.phase === 'pop' && S.struct.length === 0) {
      S.done = true; S.won = !goal;
      S.fb = { t: goal ? 'err' : 'ok', m: goal ? `La estructura quedó vacía y ${goal} no apareció.` : 'La estructura quedó vacía: recorriste todo lo alcanzable.' };
    }
  }
  function win(item) { S.done = true; S.won = true; S.path = item.path; S.cost = item.g; }
  function pop(i) {
    if (S.done) return { ok: false };
    if (S.phase !== 'pop') return info('Primero termina el paso actual; sacar viene después.');
    const e = expectedPop();
    if (i !== e) {
      const it = S.struct[e];
      return err({ bfs: `En una COLA sale el que lleva más tiempo esperando: el de la izquierda (${it.n}).`,
        dfs: `En una PILA sale el último que entró: el tope (${it.n}).`,
        ucs: `En la cola de prioridad sale el de menor costo acumulado g: ${it.n}, con g = ${it.g}.` }[algo]);
    }
    const item = S.struct.splice(i, 1)[0]; S.cur = item.n; S.curItem = item; S.steps++; S.pushed = [];
    if (algo === 'bfs') {
      S.result.push(item.n);
      if (goal && item.n === goal) { win(item); return good(`Sacaste ${item.n}: ¡es el objetivo!`); }
      S.expectPush = adj[item.n].filter(e2 => !S.visited.includes(e2.to)); S.phase = 'push';
      return good(`Sacaste ${item.n} (el primero de la cola). Ahora mete sus vecinos que aún no estén visitados.`);
    }

/* ---- 8-puzzle ---- */
function boardHTML(s) { return s.map(v => `<div class="tile${v ? '' : ' hole'}">${v || ''}</div>`).join(''); }
function renderPuz() {

  ['¿Cuál algoritmo garantiza el camino de menor costo (costos positivos)?', ['BFS', 'DFS', 'UCS', 'Hill Climbing'], 2, 'UCS expande por costo acumulado creciente. BFS solo minimiza el número de aristas.'],

  ['¿Hill Climbing guarda el camino recorrido?', ['Sí, todo', 'No, solo el estado actual', 'Solo el último paso', 'Solo en el 8-puzzle'], 1, 'Mira a sus vecinos, se mueve al mejor y olvida el camino anterior.'],
  ['Un pico más bajo que el mejor, donde Hill Climbing se detiene, se llama:', ['Máximo global', 'Máximo local', 'Meseta infinita', 'Frontera'], 1, 'Todos sus vecinos son peores, pero existe un pico más alto en otro lugar.'],
  ['Una solución cuando Hill Climbing se atasca es:', ['Reinicio aleatorio', 'Usar solo BFS', 'Quitar la función objetivo', 'Aumentar el costo'], 0, 'Volver a empezar desde otro punto da otra oportunidad de llegar al máximo global.'],

function makeQuiz() {
  const pool = QBANK.map(q => ({ q: q[0], o: q[1], a: q[2], why: q[3] })).sort(() => Math.random() - 0.5).slice(0, 8);
  const gens = Object.keys(GR).filter(k => GR[k].edges.some(e => e[2] !== 1)).sort(() => Math.random() - 0.5);
  const made = [];
  for (const gk of gens) {
    if (made.length >= 2) break;
    const g = GR[gk], start = Object.keys(g.nodes)[0];
    const ord = {}; ['bfs', 'dfs', 'ucs'].forEach(a => { ord[a] = bot(SearchGame({ algo: a, graph: gk, start, goal: '' })).result.join(' '); });
    if (new Set(Object.values(ord)).size < 3) continue;
    const a = ['bfs', 'dfs', 'ucs'][rnd(3)];
    made.push({ q: `En este grafo, empezando en ${start}, un algoritmo visitó los nodos en este orden: ${ord[a].split(' ').join(', ')}. ¿Cuál fue?`, o: ['BFS', 'DFS', 'UCS'], a: ['bfs', 'dfs', 'ucs'].indexOf(a), why: { bfs: 'Visita por niveles (cola).', dfs: 'Baja por una rama antes de retroceder (pila).', ucs: 'Sigue el menor costo acumulado g(n).' }[a], graph: gk });

}
function renderQuiz() {

}
function sbPop(i) {
